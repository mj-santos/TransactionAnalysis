# Canonical schema reference for transactions_norm
# This file documents the expected output columns and their constraints.
# It is used for documentation and can be used for runtime validation.

version: "2.0"

required_columns:
  transaction_date:
    type: DATE
    nullable: false
    description: "Canonical transaction date (UTC)"

  description:
    type: TEXT
    nullable: false
    description: "Cleaned transaction description (whitespace-normalized)"

  amount:
    type: DECIMAL(18,2)
    nullable: false
    description: "Signed amount — outflow=negative, inflow=positive"

  bank_name:
    type: TEXT
    nullable: false

  account_name:
    type: TEXT
    nullable: false

  account_id:
    type: TEXT
    nullable: false
    description: "Safe token (not full account number)"

  source_file:
    type: TEXT
    nullable: false

  source_row:
    type: INTEGER
    nullable: false

  file_hash:
    type: TEXT
    nullable: false
    description: "SHA-256 of the ingested CSV"

  transaction_fingerprint:
    type: TEXT
    nullable: false
    unique: true
    description: "SHA-256 of bank_name|account_id|date|description|amount|currency"

optional_columns:
  posted_date:
    type: DATE
    nullable: true

  merchant:
    type: TEXT
    nullable: true

  category:
    type: TEXT
    nullable: true

  currency:
    type: TEXT
    nullable: true
    default: "USD"

  ingested_at:
    type: TIMESTAMP
    nullable: true
    default: CURRENT_TIMESTAMP
