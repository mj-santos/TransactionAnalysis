# Example mapping: Separate Debit / Credit columns (common in UK/EU bank exports)
# amount_format_family: debit_credit
# Rule: amount = credit - debit (outflow negative, inflow positive)
#
# BUG FIX 3: also demonstrates amount_debit / amount_credit — the optional
# fallback canonical pair.  These can be used ALONGSIDE any primary family, or
# on their own when the bank only exports a plain "Debit" and "Credit" column
# that maps naturally to the fallback semantics (positive numbers, credit−debit).

bank_key: example_debit_credit
bank_name: "Example Bank (Debit/Credit)"
account_name: "Current Account"
account_id: "CA-XXXX-5678"

amount_format_family: debit_credit

column_map:
  "Transaction Date": transaction_date
  "Narrative": description

drop_columns:
  - "Balance"     # running balance is not needed in normalized form

date:
  transaction_date: "Transaction Date"
  # No posted_date available in this format
  date_format: "%d/%m/%Y"   # EU date format (Day/Month/Year)

amount:
  debit_col: "Debit Amount"
  credit_col: "Credit Amount"
  # Optional: map amount_debit / amount_credit as a supplemental fallback pair.
  # Useful when the CSV has BOTH a primary amount column AND explicit debit/credit
  # split columns — normalize.py uses these only when the primary family field is empty.
  # amount_debit: "Debit Amount"    # uncomment to enable fallback
  # amount_credit: "Credit Amount"  # uncomment to enable fallback

currency_default: "GBP"

locale:
  decimal_separator: "."
  thousands_separator: ","
  parentheses_negative: false
  date_locale: "EU"

# --- Expected CSV headers (for reference / documentation) ---
# Transaction Date, Narrative, Debit Amount, Credit Amount, Balance
