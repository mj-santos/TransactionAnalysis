[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance_etl"
version = "2.24.2"
description = "Local deterministic ETL + analytics for bank/credit-card transaction CSVs"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.10.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "chardet>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Install with:  pip install -e ".[wizard]"
wizard = [
    "scikit-learn>=1.3",
]

[project.scripts]
finance_etl = "finance_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.setuptools.package-data]
"finance_etl" = ["py.typed", "web/*.html", "web/static/*"]
